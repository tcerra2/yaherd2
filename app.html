<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Object Tracking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 2.5em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 0.95em; }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 30px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        button {
            padding: 12px 30px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-start {
            background: #4CAF50;
            color: white;
        }
        .btn-start:hover:not(:disabled) {
            background: #45a049;
        }
        .btn-stop {
            background: #f44336;
            color: white;
        }
        .btn-stop:hover:not(:disabled) {
            background: #da190b;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }
        .status.loading { background: #fff3cd; color: #856404; }
        .status.active { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.idle { background: #d1ecf1; color: #0c5460; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-label { font-size: 0.85em; color: #999; }
        .stat-value { font-size: 1.8em; font-weight: bold; color: #333; margin-top: 5px; }
        .debug {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85em;
            max-height: 150px;
            overflow-y: auto;
            color: #333;
        }
        .debug-line { margin: 5px 0; }
        .error { color: #d32f2f; }
        .success { color: #388e3c; }
        .confidence-control {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }
        .confidence-control label {
            font-weight: 600;
            color: #333;
            min-width: 120px;
        }
        .confidence-control input[type="range"] {
            flex: 1;
            min-width: 150px;
            cursor: pointer;
        }
        .confidence-value {
            font-weight: 600;
            color: #2196F3;
            min-width: 50px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Object Tracking</h1>
        <p class="subtitle">Real-time tracking • 100% Client-Side Processing</p>
        
        <div class="status idle" id="status">
            Ready to start (loading model...)
        </div>
        
        <div class="video-container">
            <video id="video" playsinline autoplay muted></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="confidence-control">
            <label for="confidenceSlider">Confidence:</label>
            <input type="range" id="confidenceSlider" min="0" max="100" value="50" onchange="updateConfidence(this.value)">
            <span class="confidence-value" id="confidenceValue">0.50</span>
        </div>
        
        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="startTracking()">▶ START</button>
            <button class="btn-stop" id="stopBtn" onclick="stopTracking()" disabled>⏹ STOP</button>
            <button class="btn-start" id="cameraBtn" onclick="toggleCamera()" style="background: #2196F3;">📷 FLIP CAMERA</button>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">FPS</div>
                <div class="stat-value" id="fps">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Objects</div>
                <div class="stat-value" id="detections">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Tracked IDs</div>
                <div class="stat-value" id="tracked">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Faces</div>
                <div class="stat-value" id="faces">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Time (ms)</div>
                <div class="stat-value" id="processTime">0</div>
            </div>
        </div>

        <div class="debug" id="debug"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let model = null;
        let isTracking = false;
        let frameCount = 0;
        let fps = 0;
        let lastFpsTime = performance.now();
        let trackedObjects = new Map();
        let trackedFaces = new Map();
        let nextTrackId = 0;
        let nextFaceId = 0;
        let cameraFacing = 'user'; // 'user' = front camera, 'environment' = back camera
        let confidenceThreshold = 0.5; // Default confidence threshold
        let latestFaces = []; // Latest face detections (async from server)
        let isFaceDetectionRunning = false;
        let faceDetectionQueue = [];

        function log(message, type = 'info') {
            console.log(message);
            const debugEl = document.getElementById('debug');
            const line = document.createElement('div');
            line.className = `debug-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            debugEl.appendChild(line);
            debugEl.scrollTop = debugEl.scrollHeight;
        }

        function updateStatus(message, type = 'idle') {
            document.getElementById('status').textContent = message;
            document.getElementById('status').className = `status ${type}`;
        }

        async function loadModel() {
            log('Initializing COCO-SSD model...', 'info');
            updateStatus('Loading model...', 'loading');
            try {
                model = await cocoSsd.load();
                log('✓ Model loaded successfully', 'success');
                log('✓ Face detection endpoint ready (YOLOv8n-face)', 'success');
                updateStatus('Ready! Click START to begin tracking', 'idle');
            } catch (err) {
                log(`✗ Model load error: ${err.message}`, 'error');
                updateStatus(`Error: ${err.message}`, 'error');
            }
        }

        async function startTracking() {
            if (!model) {
                log('✗ Model not loaded', 'error');
                updateStatus('Model not loaded. Wait 10 seconds...', 'error');
                return;
            }

            log('Starting tracking...', 'info');
            isTracking = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            updateStatus('🔴 TRACKING ACTIVE', 'active');
            trackedObjects.clear();
            trackedFaces.clear();
            nextTrackId = 0;
            nextFaceId = 0;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: cameraFacing, width: { ideal: 640 }, height: { ideal: 480 } }
                });
                log('✓ Camera access granted', 'success');
                
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    log(`✓ Camera: ${video.videoWidth}x${video.videoHeight}`, 'success');
                    processFrame();
                };
            } catch (err) {
                log(`✗ Camera error: ${err.message}`, 'error');
                updateStatus(`Camera error: ${err.message}`, 'error');
                isTracking = false;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            }
        }

        function updateTrack(detections) {
            const used = new Set();
            const newTracks = [];

            // Match existing tracks
            for (const [trackId, trackInfo] of trackedObjects) {
                let bestDist = 100;
                let bestIdx = -1;

                detections.forEach((det, idx) => {
                    if (used.has(idx)) return;
                    const cx = det.bbox[0] + det.bbox[2] / 2;
                    const cy = det.bbox[1] + det.bbox[3] / 2;
                    const dx = cx - trackInfo.cx;
                    const dy = cy - trackInfo.cy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < bestDist) {
                        bestDist = dist;
                        bestIdx = idx;
                    }
                });

                if (bestIdx >= 0 && bestDist < 80) {
                    used.add(bestIdx);
                    const det = detections[bestIdx];
                    trackedObjects.set(trackId, {
                        class: det.class,
                        score: det.score,
                        bbox: det.bbox,
                        cx: det.bbox[0] + det.bbox[2] / 2,
                        cy: det.bbox[1] + det.bbox[3] / 2
                    });
                    newTracks.push({ id: trackId, det });
                } else {
                    trackedObjects.delete(trackId);
                }
            }

            // Add new tracks
            detections.forEach((det, idx) => {
                if (!used.has(idx)) {
                    const id = nextTrackId++;
                    trackedObjects.set(id, {
                        class: det.class,
                        score: det.score,
                        bbox: det.bbox,
                        cx: det.bbox[0] + det.bbox[2] / 2,
                        cy: det.bbox[1] + det.bbox[3] / 2
                    });
                    newTracks.push({ id, det });
                }
            });

            return newTracks;
        }

        // ======================================
        // FACE TRACKING (Parallel, Non-blocking)
        // ======================================

        function updateFaceTrack(newFaces) {
            const now = Date.now();
            const used = new Set();
            const FACE_TIMEOUT = 5000; // Remove faces unseen for >5 seconds
            
            // Remove stale faces (inactive for too long)
            for (const [faceId, faceInfo] of trackedFaces) {
                if (now - faceInfo.lastSeen > FACE_TIMEOUT) {
                    trackedFaces.delete(faceId);
                    continue;
                }
                
                // Match existing face tracks to new detections
                let bestDist = Infinity;
                let bestIdx = -1;

                newFaces.forEach((face, idx) => {
                    if (used.has(idx)) return;
                    
                    // Center of face bounding box
                    const newCx = (face.x1 + face.x2) / 2;
                    const newCy = (face.y1 + face.y2) / 2;
                    
                    // Distance from previous position
                    const dx = newCx - faceInfo.cx;
                    const dy = newCy - faceInfo.cy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < bestDist) {
                        bestDist = dist;
                        bestIdx = idx;
                    }
                });

                // Update track if close match found (within 150 pixels)
                if (bestIdx >= 0 && bestDist < 150) {
                    used.add(bestIdx);
                    const face = newFaces[bestIdx];
                    trackedFaces.set(faceId, {
                        x1: face.x1,
                        y1: face.y1,
                        x2: face.x2,
                        y2: face.y2,
                        cx: (face.x1 + face.x2) / 2,
                        cy: (face.y1 + face.y2) / 2,
                        confidence: face.confidence,
                        lastSeen: now
                    });
                }
            }

            // Add new face tracks
            newFaces.forEach((face, idx) => {
                if (!used.has(idx)) {
                    const faceId = nextFaceId++;
                    trackedFaces.set(faceId, {
                        x1: face.x1,
                        y1: face.y1,
                        x2: face.x2,
                        y2: face.y2,
                        cx: (face.x1 + face.x2) / 2,
                        cy: (face.y1 + face.y2) / 2,
                        confidence: face.confidence,
                        lastSeen: now
                    });
                }
            });
        }

        async function detectFaces() {
            if (!isTracking || !canvas || canvas.width === 0) return;
            if (isFaceDetectionRunning) {
                faceDetectionQueue.push(true);
                return; // Skip if already running
            }

            isFaceDetectionRunning = true;

            try {
                // Convert canvas to base64 string
                const imageData = canvas.toDataURL('image/jpeg', 0.7); // 0.7 quality for speed

                const response = await fetch('/api/detect-faces', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });

                if (response.ok) {
                    const result = await response.json();
                    latestFaces = result.faces || [];
                    updateFaceTrack(latestFaces);
                } else {
                    console.warn('Face detection HTTP error:', response.status);
                }
            } catch (err) {
                console.warn('Face detection error (non-blocking):', err.message);
                // Don't log to UI - face detection is optional
            } finally {
                isFaceDetectionRunning = false;
                // Process queue - retry if requests were queued
                if (faceDetectionQueue.length > 0) {
                    faceDetectionQueue = [];
                    // Schedule next detection immediately
                    detectFaces().catch(err => console.warn('Queued detection error:', err));
                }
            }
        }

        async function processFrame() {
            if (!isTracking) return;

            const startTime = performance.now();

            try {
                // Detect objects (MAIN - must not be blocked)
                const predictions = await model.detect(video);
                const filtered = predictions.filter(p => p.score > confidenceThreshold);
                
                // Track objects
                const tracked = updateTrack(filtered);

                // Start face detection in parallel (non-blocking)
                detectFaces().catch(err => console.warn('Face detection queue error:', err));

                // Draw
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(video, 0, 0);

                // Draw object boxes (GREEN)
                tracked.forEach(t => {
                    const [x, y, w, h] = t.det.bbox;
                    
                    ctx.strokeStyle = '#00FF00';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, w, h);

                    ctx.fillStyle = '#00FF00';
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText(`ID:${t.id}`, x, y - 10);

                    ctx.font = '12px Arial';
                    ctx.fillText(`${t.det.class}`, x, y + h + 20);
                });

                // Draw face boxes (MAGENTA) - these are async, may lag slightly
                trackedFaces.forEach((face, faceId) => {
                    const { x1, y1, x2, y2, confidence } = face;
                    const w = x2 - x1;
                    const h = y2 - y1;

                    ctx.strokeStyle = '#FF00FF';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x1, y1, w, h);

                    ctx.fillStyle = '#FF00FF';
                    ctx.font = 'bold 14px Arial';
                    ctx.fillText(`Face #${faceId}`, x1, y1 - 10);

                    ctx.font = '11px Arial';
                    ctx.fillText(`${(confidence * 100).toFixed(0)}%`, x1, y2 + 18);
                });

                // Stats
                frameCount++;
                const now = performance.now();
                if (now - lastFpsTime >= 1000) {
                    fps = frameCount;
                    frameCount = 0;
                    lastFpsTime = now;
                }

                document.getElementById('fps').textContent = fps;
                document.getElementById('detections').textContent = filtered.length;
                document.getElementById('tracked').textContent = tracked.length;
                document.getElementById('faces').textContent = trackedFaces.size;
                document.getElementById('processTime').textContent = Math.round(performance.now() - startTime);

            } catch (err) {
                log(`Detection error: ${err.message}`, 'error');
            }

            requestAnimationFrame(processFrame);
        }

        function stopTracking() {
            isTracking = false;
            log('Tracking stopped', 'info');
            updateStatus('Stopped', 'idle');

            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }

        function toggleCamera() {
            const cameraName = cameraFacing === 'user' ? 'Back Camera' : 'Front Camera';
            cameraFacing = cameraFacing === 'user' ? 'environment' : 'user';
            
            if (isTracking) {
                log('Switching to ' + cameraName + '...', 'info');
                stopTracking();
                setTimeout(() => {
                    startTracking();
                }, 500);
            } else {
                log('Camera switched to: ' + cameraName, 'success');
                updateStatus('Ready with ' + cameraName, 'idle');
            }
        }

        function updateConfidence(value) {
            confidenceThreshold = value / 100;
            document.getElementById('confidenceValue').textContent = confidenceThreshold.toFixed(2);
            log('Confidence threshold set to: ' + confidenceThreshold.toFixed(2), 'info');
        }

        // Initialize on load
        window.addEventListener('load', () => {
            log('App loaded. Initializing...', 'info');
            loadModel();
        });

        window.addEventListener('beforeunload', () => {
            stopTracking();
        });
    </script>
</body>
</html>
