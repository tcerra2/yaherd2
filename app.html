<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Object Tracking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 2.5em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 0.95em; }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 30px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        button {
            padding: 12px 30px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-start {
            background: #4CAF50;
            color: white;
        }
        .btn-start:hover:not(:disabled) {
            background: #45a049;
        }
        .btn-stop {
            background: #f44336;
            color: white;
        }
        .btn-stop:hover:not(:disabled) {
            background: #da190b;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }
        .status.loading { background: #fff3cd; color: #856404; }
        .status.active { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.idle { background: #d1ecf1; color: #0c5460; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-label { font-size: 0.85em; color: #999; }
        .stat-value { font-size: 1.8em; font-weight: bold; color: #333; margin-top: 5px; }
        .debug {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85em;
            max-height: 150px;
            overflow-y: auto;
            color: #333;
        }
        .debug-line { margin: 5px 0; }
        .error { color: #d32f2f; }
        .success { color: #388e3c; }
        .confidence-control {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }
        .confidence-control label {
            font-weight: 600;
            color: #333;
            min-width: 120px;
        }
        .confidence-control input[type="range"] {
            flex: 1;
            min-width: 150px;
            cursor: pointer;
        }
        .confidence-value {
            font-weight: 600;
            color: #2196F3;
            min-width: 50px;
            text-align: right;
        }
        .advanced-controls {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: grid;
            gap: 12px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .control-group label {
            font-weight: 600;
            color: #333;
            min-width: 120px;
            font-size: 0.95em;
        }
        .control-group input[type="range"] {
            flex: 1;
            min-width: 120px;
            cursor: pointer;
        }
        .control-value {
            font-weight: 600;
            color: #2196F3;
            min-width: 45px;
            text-align: right;
            font-size: 0.9em;
        }
        .face-gallery {
            margin-top: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
        }
        .face-gallery-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            font-size: 1em;
        }
        .face-thumbnails {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
            gap: 12px;
            min-height: 140px;
            max-height: 160px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .face-thumbnails::-webkit-scrollbar {
            width: 8px;
        }
        .face-thumbnails::-webkit-scrollbar-track {
            background: #e0e0e0;
            border-radius: 4px;
        }
        .face-thumbnails::-webkit-scrollbar-thumb {
            background: #2196F3;
            border-radius: 4px;
        }
        .face-thumbnails::-webkit-scrollbar-thumb:hover {
            background: #1976D2;
        }
        .face-card {
            background: white;
            border: 2px solid #2196F3;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.15);
            cursor: pointer;
        }
        .face-card:hover {
            border-color: #1976D2;
            box-shadow: 0 6px 16px rgba(33, 150, 243, 0.3);
            transform: translateY(-2px);
        }
        .face-image {
            width: 100%;
            height: 95px;
            object-fit: cover;
            border-radius: 6px;
            background: #e0e0e0;
            display: block;
        }
        .face-info {
            margin-top: 6px;
            font-size: 0.7em;
        }
        .face-id {
            font-weight: 700;
            color: #2196F3;
            margin-bottom: 1px;
            font-size: 0.85em;
        }
        .person-id {
            color: #666;
            font-size: 0.65em;
            margin-bottom: 1px;
        }
        .face-confidence {
            color: #4CAF50;
            font-size: 0.65em;
            font-weight: 600;
            margin-bottom: 1px;
        }
        .face-timestamp {
            color: #999;
            font-size: 0.6em;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Object Tracking</h1>
        <p class="subtitle">Real-time tracking • 100% Client-Side Processing</p>
        
        <div class="status idle" id="status">
            Ready to start (loading model...)
        </div>
        
        <div class="video-container">
            <video id="video" playsinline autoplay muted></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="face-gallery" id="faceGalleryContainer" style="display: none;">
            <div class="face-gallery-title">👤 Detected Faces</div>
            <div class="face-thumbnails" id="faceThumbnails"></div>
        </div>
        
        <div class="confidence-control">
            <label for="confidenceSlider">Confidence:</label>
            <input type="range" id="confidenceSlider" min="0" max="100" value="50" onchange="updateConfidence(this.value)">
            <span class="confidence-value" id="confidenceValue">0.50</span>
        </div>
        
        <div class="advanced-controls">
            <div class="control-group">
                <label for="exposureSlider">Exposure:</label>
                <input type="range" id="exposureSlider" min="-50" max="50" value="0" onchange="updateExposure(this.value)">
                <span class="control-value" id="exposureValue">0</span>
            </div>
            <div class="control-group">
                <label for="contrastSlider">Contrast:</label>
                <input type="range" id="contrastSlider" min="50" max="200" value="100" onchange="updateContrast(this.value)">
                <span class="control-value" id="contrastValue">100%</span>
            </div>
            <div class="control-group">
                <label for="faceConfidenceSlider">Face Confidence:</label>
                <input type="range" id="faceConfidenceSlider" min="0" max="100" value="50" onchange="updateFaceConfidence(this.value)">
                <span class="control-value" id="faceConfidenceValue">0.50</span>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="startTracking()">▶ START</button>
            <button class="btn-stop" id="stopBtn" onclick="stopTracking()" disabled>⏹ STOP</button>
            <button class="btn-start" id="cameraBtn" onclick="toggleCamera()" style="background: #2196F3;">📷 FLIP CAMERA</button>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">FPS</div>
                <div class="stat-value" id="fps">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Objects</div>
                <div class="stat-value" id="detections">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Tracked IDs</div>
                <div class="stat-value" id="tracked">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Faces</div>
                <div class="stat-value" id="trackedFaces">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Time (ms)</div>
                <div class="stat-value" id="processTime">0</div>
            </div>
        </div>

        <div class="debug" id="debug"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let model = null;
        let isTracking = false;
        let frameCount = 0;
        let fps = 0;
        let lastFpsTime = performance.now();
        let trackedObjects = new Map();
        let nextTrackId = 0;
        let cameraFacing = 'user'; // 'user' = front camera, 'environment' = back camera
        let confidenceThreshold = 0.5; // Default confidence threshold
        
        // Face detection sidecar state
        let faceDetections = [];
        let facePollingTimer = null;
        let faceRequestInFlight = false;
        let faceAbortController = null;
        let faceDetectionEnabled = true;
        let facePollIntervalMs = 750;
        let faceRequestTimeoutMs = 3500;
        let faceOverlayUpdatedAt = 0;
        let lastFaceErrorAt = 0;
        const FACE_RESULT_TTL_MS = 2000;
        const MIN_FACE_BOX_SIZE_PX = 20;
        const faceCaptureCanvas = document.createElement('canvas');
        const faceCaptureContext = faceCaptureCanvas.getContext('2d');
        
        // Image processing variables
        let exposureValue = 0; // -50 to 50
        let contrastValue = 100; // 50 to 200
        let faceConfidenceThreshold = 0.5; // Face detection confidence

        function log(message, type = 'info') {
            console.log(message);
            const debugEl = document.getElementById('debug');
            const line = document.createElement('div');
            line.className = `debug-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            debugEl.appendChild(line);
            debugEl.scrollTop = debugEl.scrollHeight;
        }

        function updateStatus(message, type = 'idle') {
            document.getElementById('status').textContent = message;
            document.getElementById('status').className = `status ${type}`;
        }

        async function loadModel() {
            log('Initializing COCO-SSD model...', 'info');
            updateStatus('Loading model...', 'loading');
            try {
                model = await cocoSsd.load();
                log('✓ COCO-SSD model loaded successfully', 'success');
                log('✓ Face detection sidecar available through /api/detect-faces', 'success');
                
                updateStatus('Ready! Click START to begin tracking', 'idle');
            } catch (err) {
                log(`✗ Model load error: ${err.message}`, 'error');
                updateStatus(`Error: ${err.message}`, 'error');
            }
        }

        async function startTracking() {
            if (!model) {
                log('✗ Model not loaded', 'error');
                updateStatus('Model not loaded. Wait 10 seconds...', 'error');
                return;
            }

            log('Starting tracking...', 'info');
            isTracking = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            updateStatus('🔴 TRACKING ACTIVE', 'active');
            trackedObjects.clear();
            nextTrackId = 0;
            clearFaceDetections();
            log('✓ Tracking started. Object tracking remains local; face detection polls separately.', 'success');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: cameraFacing, width: { ideal: 640 }, height: { ideal: 480 } }
                });
                log('✓ Camera access granted', 'success');
                
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    faceCaptureCanvas.width = video.videoWidth;
                    faceCaptureCanvas.height = video.videoHeight;
                    log(`✓ Camera: ${video.videoWidth}x${video.videoHeight}`, 'success');
                    startFacePolling();
                    processFrame();
                };
            } catch (err) {
                log(`✗ Camera error: ${err.message}`, 'error');
                updateStatus(`Camera error: ${err.message}`, 'error');
                isTracking = false;
                stopFacePolling();
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            }
        }

        function updateTrack(detections) {
            const used = new Set();
            const newTracks = [];

            // Match existing tracks
            for (const [trackId, trackInfo] of trackedObjects) {
                let bestDist = 100;
                let bestIdx = -1;

                detections.forEach((det, idx) => {
                    if (used.has(idx)) return;
                    const cx = det.bbox[0] + det.bbox[2] / 2;
                    const cy = det.bbox[1] + det.bbox[3] / 2;
                    const dx = cx - trackInfo.cx;
                    const dy = cy - trackInfo.cy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < bestDist) {
                        bestDist = dist;
                        bestIdx = idx;
                    }
                });

                if (bestIdx >= 0 && bestDist < 80) {
                    used.add(bestIdx);
                    const det = detections[bestIdx];
                    trackedObjects.set(trackId, {
                        class: det.class,
                        score: det.score,
                        bbox: det.bbox,
                        cx: det.bbox[0] + det.bbox[2] / 2,
                        cy: det.bbox[1] + det.bbox[3] / 2
                    });
                    newTracks.push({ id: trackId, det });
                } else {
                    trackedObjects.delete(trackId);
                }
            }

            // Add new tracks
            detections.forEach((det, idx) => {
                if (!used.has(idx)) {
                    const id = nextTrackId++;
                    trackedObjects.set(id, {
                        class: det.class,
                        score: det.score,
                        bbox: det.bbox,
                        cx: det.bbox[0] + det.bbox[2] / 2,
                        cy: det.bbox[1] + det.bbox[3] / 2
                    });
                    newTracks.push({ id, det });
                }
            });

            return newTracks;
        }

        async function loadServerConfig() {
            try {
                const response = await fetch('/api/config', { cache: 'no-store' });
                if (!response.ok) {
                    return;
                }

                const config = await response.json();
                const faceConfig = config.faceDetection || {};
                faceDetectionEnabled = faceConfig.enabled !== false;
                facePollIntervalMs = Number.isFinite(faceConfig.pollIntervalMs) ? faceConfig.pollIntervalMs : facePollIntervalMs;
                faceRequestTimeoutMs = Number.isFinite(faceConfig.timeoutMs) ? Math.max(250, faceConfig.timeoutMs - 250) : faceRequestTimeoutMs;

                if (!faceDetectionEnabled) {
                    log('Face detection is disabled by server configuration.', 'info');
                }
            } catch (err) {
                log('Using local face detection defaults.', 'info');
            }
        }

        function logFaceError(message) {
            const now = performance.now();
            if (now - lastFaceErrorAt >= 5000) {
                log(message, 'error');
                lastFaceErrorAt = now;
            }
        }

        function clearFaceDetections() {
            faceDetections = [];
            faceOverlayUpdatedAt = 0;
            document.getElementById('trackedFaces').textContent = '0';
        }

        function stopFacePolling() {
            if (facePollingTimer !== null) {
                clearInterval(facePollingTimer);
                facePollingTimer = null;
            }

            if (faceAbortController) {
                faceAbortController.abort();
                faceAbortController = null;
            }

            faceRequestInFlight = false;
        }

        function startFacePolling() {
            stopFacePolling();

            if (!faceDetectionEnabled) {
                clearFaceDetections();
                return;
            }

            facePollingTimer = window.setInterval(() => {
                void pollFaces();
            }, facePollIntervalMs);

            void pollFaces();
        }

        function captureFaceFrame() {
            if (!video.videoWidth || !video.videoHeight) {
                return null;
            }

            if (faceCaptureCanvas.width !== video.videoWidth || faceCaptureCanvas.height !== video.videoHeight) {
                faceCaptureCanvas.width = video.videoWidth;
                faceCaptureCanvas.height = video.videoHeight;
            }

            faceCaptureContext.drawImage(video, 0, 0, faceCaptureCanvas.width, faceCaptureCanvas.height);
            return faceCaptureCanvas.toDataURL('image/jpeg', 0.8);
        }

        function normalizeFaceDetections(rawFaces) {
            if (!Array.isArray(rawFaces)) {
                return [];
            }

            return rawFaces.map((face) => {
                const x1 = Number(face.x1);
                const y1 = Number(face.y1);
                const x2 = Number(face.x2);
                const y2 = Number(face.y2);
                const confidence = Number(face.confidence ?? 0);

                if (![x1, y1, x2, y2].every(Number.isFinite) || x2 <= x1 || y2 <= y1) {
                    return null;
                }

                return {
                    x1,
                    y1,
                    x2,
                    y2,
                    confidence,
                    width: x2 - x1,
                    height: y2 - y1
                };
            }).filter(Boolean);
        }

        async function pollFaces() {
            if (!isTracking || !faceDetectionEnabled || faceRequestInFlight || video.readyState < 2) {
                return;
            }

            const image = captureFaceFrame();
            if (!image) {
                return;
            }

            faceRequestInFlight = true;
            faceAbortController = new AbortController();
            const timeoutId = window.setTimeout(() => {
                if (faceAbortController) {
                    faceAbortController.abort();
                }
            }, faceRequestTimeoutMs);

            try {
                const response = await fetch('/api/detect-faces', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image }),
                    signal: faceAbortController.signal
                });

                const payload = await response.json().catch(() => ({ faces: [] }));

                if (payload.disabled) {
                    faceDetectionEnabled = false;
                    stopFacePolling();
                    clearFaceDetections();
                    log('Face detection disabled by backend.', 'info');
                    return;
                }

                faceDetections = normalizeFaceDetections(payload.faces)
                    .filter((face) => face.confidence >= faceConfidenceThreshold)
                    .filter((face) => face.width >= MIN_FACE_BOX_SIZE_PX && face.height >= MIN_FACE_BOX_SIZE_PX);
                faceOverlayUpdatedAt = performance.now();
            } catch (err) {
                clearFaceDetections();

                if (err.name === 'AbortError') {
                    logFaceError('Face detection request timed out. Continuing without face overlay.');
                } else {
                    logFaceError(`Face detection unavailable: ${err.message}`);
                }
            } finally {
                window.clearTimeout(timeoutId);
                faceAbortController = null;
                faceRequestInFlight = false;
            }
        }

        function drawFaceOverlay() {
            if (!faceDetectionEnabled) {
                return;
            }

            if (faceOverlayUpdatedAt && performance.now() - faceOverlayUpdatedAt > FACE_RESULT_TTL_MS) {
                faceDetections = [];
            }

            faceDetections.forEach((face) => {
                const labelY = Math.max(12, face.y1 - 6);

                ctx.strokeStyle = '#FF00FF';
                ctx.lineWidth = 2;
                ctx.strokeRect(face.x1, face.y1, face.width, face.height);

                ctx.fillStyle = '#FF00FF';
                ctx.font = 'bold 12px Arial';
                ctx.fillText(`Face ${(face.confidence * 100).toFixed(0)}%`, face.x1, labelY);
            });
        }

        async function processFrame() {
            if (!isTracking) return;

            const startTime = performance.now();

            try {
                // Detect objects
                const predictions = await model.detect(video);
                const filtered = predictions.filter(p => p.score > confidenceThreshold);
                
                // Track objects
                const tracked = updateTrack(filtered);

                // Draw
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Apply image processing filters
                if (exposureValue !== 0 || contrastValue !== 100) {
                    const brightness = 100 + exposureValue;
                    ctx.filter = `brightness(${brightness}%) contrast(${contrastValue}%)`;
                }
                
                ctx.drawImage(video, 0, 0);
                ctx.filter = 'none'; // Reset filter for drawing text/boxes

                // Draw YOLO boxes
                tracked.forEach(t => {
                    const [x, y, w, h] = t.det.bbox;
                    
                    ctx.strokeStyle = '#00FF00';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, w, h);

                    ctx.fillStyle = '#00FF00';
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText(`ID:${t.id}`, x, y - 10);

                    ctx.font = '12px Arial';
                    ctx.fillText(`${t.det.class}`, x, y + h + 20);
                });

                drawFaceOverlay();

                // Stats
                frameCount++;
                const now = performance.now();
                if (now - lastFpsTime >= 1000) {
                    fps = frameCount;
                    frameCount = 0;
                    lastFpsTime = now;
                }

                document.getElementById('fps').textContent = fps;
                document.getElementById('detections').textContent = filtered.length;
                document.getElementById('tracked').textContent = tracked.length;
                document.getElementById('trackedFaces').textContent = faceDetections.length;
                document.getElementById('processTime').textContent = Math.round(performance.now() - startTime);

            } catch (err) {
                log(`Detection error: ${err.message}`, 'error');
            }

            requestAnimationFrame(processFrame);
        }

        function stopTracking() {
            isTracking = false;
            log('Tracking stopped', 'info');
            updateStatus('Stopped', 'idle');
            stopFacePolling();

            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            clearFaceDetections();
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }

        function toggleCamera() {
            const cameraName = cameraFacing === 'user' ? 'Back Camera' : 'Front Camera';
            cameraFacing = cameraFacing === 'user' ? 'environment' : 'user';
            
            if (isTracking) {
                log('Switching to ' + cameraName + '...', 'info');
                stopTracking();
                setTimeout(() => {
                    startTracking();
                }, 500);
            } else {
                log('Camera switched to: ' + cameraName, 'success');
                updateStatus('Ready with ' + cameraName, 'idle');
            }
        }

        function updateConfidence(value) {
            confidenceThreshold = value / 100;
            document.getElementById('confidenceValue').textContent = confidenceThreshold.toFixed(2);
            log('Confidence threshold set to: ' + confidenceThreshold.toFixed(2), 'info');
        }
        
        function updateExposure(value) {
            exposureValue = parseInt(value);
            document.getElementById('exposureValue').textContent = (exposureValue >= 0 ? '+' : '') + exposureValue;
            log('Exposure adjusted: ' + exposureValue, 'info');
        }
        
        function updateContrast(value) {
            contrastValue = parseInt(value);
            document.getElementById('contrastValue').textContent = contrastValue + '%';
            log('Contrast adjusted: ' + contrastValue + '%', 'info');
        }
        
        function updateFaceConfidence(value) {
            faceConfidenceThreshold = value / 100;
            document.getElementById('faceConfidenceValue').textContent = faceConfidenceThreshold.toFixed(2);
            log('Face confidence threshold set to: ' + faceConfidenceThreshold.toFixed(2), 'info');
        }

        // Initialize on load
        window.addEventListener('load', () => {
            log('App loaded. Initializing...', 'info');
            void loadServerConfig();
            loadModel();
        });

        window.addEventListener('beforeunload', () => {
            stopTracking();
        });
    </script>
</body>
</html>
